    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Noto Sans JP', -apple-system, sans-serif; background: linear-gradient(160deg, #0a0f1e 0%, #101b35 50%, #0d1a2d 100%); color: #e2e8f0; min-height: 100vh; min-height: 100dvh; overflow-x: hidden; }
        
        .screen { display: none; min-height: 100vh; min-height: 100dvh; flex-direction: column; }
        .screen.active { display: flex; animation: screenIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        @keyframes screenIn { from { opacity: 0; transform: translateY(18px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        
        .app-header { display: flex; align-items: center; padding: 14px 20px; gap: 10px; background: rgba(10, 15, 30, 0.85); border-bottom: 1px solid rgba(255, 255, 255, 0.06); position: sticky; top: 0; z-index: 10; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .app-header h1 { font-size: 17px; font-weight: 700; color: #f1f5f9; }
        .back-btn { background: none; border: none; color: #94a3b8; font-size: 22px; cursor: pointer; padding: 6px 10px 6px 0; transition: color 0.15s; }
        .back-btn:hover { color: #e2e8f0; }
        
        .btn { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 17px 24px; border: none; border-radius: 18px; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1); width: 100%; position: relative; overflow: hidden; }
        .btn::after { content: ''; position: absolute; inset: 0; border-radius: inherit; opacity: 0; transition: opacity 0.2s; background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), transparent); }
        .btn:hover::after { opacity: 1; }
        .btn:active { transform: scale(0.96); }
        .btn:disabled { opacity: 0.5; pointer-events: none; }
        
        .btn-primary { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: #fff; box-shadow: 0 6px 30px rgba(59, 130, 246, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.15); }
        .btn-success { background: linear-gradient(135deg, #10b981 0%, #047857 100%); color: #fff; box-shadow: 0 6px 30px rgba(16, 185, 129, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.15); }
        .btn-secondary { background: rgba(255, 255, 255, 0.06); color: #cbd5e1; border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(8px); }
        .btn-danger { background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); color: #fff; box-shadow: 0 6px 30px rgba(239, 68, 68, 0.3); }
        .btn-lg { padding: 20px 28px; font-size: 18px; border-radius: 20px; }
        
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 8px; }
        .form-input, .form-textarea { width: 100%; padding: 14px 16px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 14px; color: #f1f5f9; font-family: inherit; font-size: 15px; transition: all 0.2s; -webkit-appearance: none; appearance: none; }
        .form-input:focus, .form-textarea:focus { outline: none; border-color: #3b82f6; background: rgba(59, 130, 246, 0.06); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12); }
        input[type="date"]::-webkit-calendar-picker-indicator, input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(0.6); }
        .form-textarea { min-height: 75px; resize: vertical; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        #screen-setup { align-items: center; justify-content: center; padding: 40px 24px; gap: 24px; text-align: center; }
        .setup-icon { font-size: 64px; filter: drop-shadow(0 8px 24px rgba(59, 130, 246, 0.3)); animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .setup-card { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; padding: 28px; width: 100%; max-width: 400px; backdrop-filter: blur(12px); }
        .setup-title { font-size: 22px; font-weight: 900; color: #f1f5f9; margin-bottom: 8px; }
        .setup-desc { font-size: 13px; color: #64748b; margin-bottom: 20px; line-height: 1.7; }
        .setup-url-input { width: 100%; padding: 14px; margin-bottom: 14px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 14px; color: #f1f5f9; font-family: inherit; font-size: 13px; resize: none; }
        
        #screen-home { align-items: center; justify-content: center; padding: 40px 24px; gap: 28px; text-align: center; }
        .home-logo { font-size: 80px; filter: drop-shadow(0 8px 32px rgba(59, 130, 246, 0.4)); animation: float 3s ease-in-out infinite; }
        .home-title { font-size: 28px; font-weight: 900; color: #f1f5f9; line-height: 1.3; }
        .home-subtitle { font-size: 14px; color: #475569; margin-top: 8px; line-height: 1.6; }
        .home-buttons { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
        .home-footer { font-size: 11px; color: #1e3a5f; margin-top: 4px; letter-spacing: 0.5px; }
        
        #screen-preview { background: #000; }
        #preview-img { width: 100%; flex: 1; object-fit: contain; max-height: 72vh; }
        .preview-actions { padding: 20px; display: flex; gap: 12px; background: linear-gradient(to top, rgba(0, 0, 0, 0.95), rgba(0, 0, 0, 0.7)); }
        .preview-actions .btn { flex: 1; }
        
        #screen-analyzing { align-items: center; justify-content: center; gap: 32px; padding: 40px; text-align: center; }
        .analyzing-wrap { position: relative; width: 120px; height: 120px; display: flex; align-items: center; justify-content: center; }
        .analyzing-ring { position: absolute; width: 120px; height: 120px; border: 4px solid rgba(59, 130, 246, 0.1); border-top-color: #3b82f6; border-right-color: #60a5fa; border-radius: 50%; animation: spin 1s linear infinite; }
        .analyzing-ring2 { position: absolute; width: 88px; height: 88px; border: 3px solid rgba(59, 130, 246, 0.05); border-bottom-color: #818cf8; border-radius: 50%; animation: spin 1.6s linear infinite reverse; }
        .analyzing-ring3 { position: absolute; width: 56px; height: 56px; border: 2px solid rgba(139, 92, 246, 0.08); border-left-color: #a78bfa; border-radius: 50%; animation: spin 2s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .analyzing-icon { font-size: 32px; animation: pulse 1.8s ease-in-out infinite; z-index: 1; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
        .analyzing-title { font-size: 24px; font-weight: 900; color: #f1f5f9; }
        .analyzing-sub { font-size: 14px; color: #475569; line-height: 1.8; }
        .analyzing-dots::after { content: ''; animation: dots 1.5s steps(4) infinite; }
        @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
        
        #screen-form { overflow-y: auto; }
        .form-photo-preview { width: 100%; max-height: 200px; object-fit: cover; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
        .form-body { padding: 20px 20px 40px; }
        .ai-badge { display: inline-flex; align-items: center; gap: 6px; background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(139, 92, 246, 0.1)); border: 1px solid rgba(59, 130, 246, 0.2); border-radius: 24px; padding: 6px 16px; font-size: 12px; color: #818cf8; margin-bottom: 22px; font-weight: 600; }
        
        #screen-success { align-items: center; justify-content: center; gap: 28px; padding: 40px; text-align: center; }
        .success-icon { font-size: 96px; animation: bounceIn 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97) forwards; }
        @keyframes bounceIn { 0% { transform: scale(0); opacity: 0; } 55% { transform: scale(1.2); } 75% { transform: scale(0.92); } 100% { transform: scale(1); opacity: 1; } }
        .success-title { font-size: 28px; font-weight: 900; color: #10b981; }
        .success-item-name { font-size: 20px; color: #f1f5f9; font-weight: 700; margin-top: 6px; }
        .success-row-info { font-size: 13px; color: #475569; margin-top: 4px; }
        .success-btn-group { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
        
        #screen-list { overflow-y: auto; }
        .list-filter-bar { display: flex; gap: 6px; padding: 10px 16px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(0,0,0,0.2); }
        .list-filter-btn { padding: 6px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: #94a3b8; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
        .list-filter-btn.active { background: #3b82f6; border-color: #3b82f6; color: #fff; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }
        
        .list-stats { padding: 12px 16px 8px; font-size: 11px; color: #94a3b8; display: flex; gap: 12px; flex-wrap: wrap; }
        .list-stats span { display: flex; align-items: center; gap: 4px; }
        .stat-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
        
        .list-table-wrap { overflow-x: auto; padding: 0 0 32px; }
        .list-table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 650px; } 
        .list-table thead th { padding: 12px; text-align: left; background: rgba(10,15,30,0.98); border-bottom: 1px solid rgba(255,255,255,0.1); color: #64748b; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; white-space: nowrap; }
        .list-table tbody tr { border-bottom: 1px solid rgba(255,255,255,0.04); }
        .list-table tbody tr:hover { background: rgba(255,255,255,0.02); }
        .list-table tbody tr.tr-returned { opacity: 0.6; }
        .list-table td { padding: 12px; vertical-align: middle; color: #cbd5e1; }
        .list-table td.td-item { font-weight: 700; color: #f1f5f9; }
        .list-table td.td-thumb { width: 52px; padding: 6px 8px; }
        .list-table td.td-thumb img { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; display: block; }
        .list-table td.td-thumb .no-img { width: 44px; height: 44px; border-radius: 8px; background: rgba(255,255,255,0.04); display: flex; align-items: center; justify-content: center; font-size: 18px; color: #1e3a5f; }
        
        .td-notes { max-width: 160px; font-size: 11px; white-space: normal !important; line-height: 1.4; color: #94a3b8; }

        .ret-btn { padding: 4px 10px; font-size: 10px; font-weight: 700; border: 1px solid rgba(139,92,246,0.3); background: rgba(139,92,246,0.08); color: #a78bfa; border-radius: 10px; cursor: pointer; white-space: nowrap; }
        
        .action-btn-process { border-color: rgba(59, 130, 246, 0.3); background: rgba(59, 130, 246, 0.08); color: #60a5fa; }
        .action-btn-undo { border-color: rgba(100, 116, 139, 0.3); background: rgba(100, 116, 139, 0.08); color: #94a3b8; }
        .status-police { background: rgba(59, 130, 246, 0.1); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.2); }

        .status-badge { font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 20px; white-space: nowrap; display: inline-block; }
        .status-done { background: rgba(16, 185, 129, 0.1); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.2); }
        .status-pending { background: rgba(234, 179, 8, 0.1); color: #fbbf24; border: 1px solid rgba(234, 179, 8, 0.2); }
        .status-error { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); }
        .status-returned { background: rgba(139, 92, 246, 0.1); color: #a78bfa; border: 1px solid rgba(139, 92, 246, 0.2); }
        
        .list-state { text-align: center; padding: 64px 20px; color: #334155; font-size: 15px; }
        .list-spinner { width: 44px; height: 44px; border: 3px solid rgba(59, 130, 246, 0.1); border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.9s linear infinite; margin: 0 auto 16px; }
        
        #camera-input { position: absolute; width: 0; height: 0; opacity: 0; }
        
        .toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(30, 40, 60, 0.95); color: #f1f5f9; padding: 14px 24px; border-radius: 16px; font-size: 14px; font-weight: 600; backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4); z-index: 100; opacity: 0; transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1); }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        
        .error-banner { background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 14px; padding: 14px 16px; margin: 16px 20px 0; color: #f87171; font-size: 13px; line-height: 1.6; display: none; }
        .error-banner.show { display: block; animation: screenIn 0.3s ease; }

        .delete-checkbox { width: 18px; height: 18px; cursor: pointer; accent-color: #ef4444; }
        .police-alert { margin: 12px 16px; padding: 14px; border-radius: 14px; background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.35); color: #fecaca; font-size: 13px; line-height: 1.6; text-align: left; }
        .police-alert strong { display: block; color: #fff; }
        .valuable-badge { color: #fbbf24; font-size: 11px; white-space: nowrap; }
        .valuable-toggle { margin-top: 4px; border-color: rgba(251,191,36,.35); color: #fbbf24; background: rgba(251,191,36,.08); }
        .bulk-old-btn { border: 1px solid rgba(239,68,68,.4); background: rgba(239,68,68,.1); color: #fca5a5; border-radius: 10px; padding: 7px 10px; font: inherit; font-size: 11px; font-weight: 700; cursor: pointer; }
    </style>
</head>

<body>
    <div id="screen-setup" class="screen active">
        <div class="setup-icon">📦</div>
        <div class="setup-card">
            <div class="setup-title">⚙️ 初回設定</div>
            <div class="setup-desc">GASのデプロイURLを入力してください。<br>一度設定すると次回から不要です。</div>
            <textarea class="setup-url-input" id="gas-url-input" rows="3" placeholder="https://script.google.com/macros/s/XXXX/exec"></textarea>
            <button class="btn btn-primary" onclick="saveGasUrl()">✅ 設定して始める</button>
        </div>
        <div style="font-size:12px; color:#1e3a5f;">設定したURLはこのデバイスに保存されます</div>
    </div>

    <div id="screen-home" class="screen">
        <div class="home-logo">📦</div>
        <div>
            <div class="home-title">拾得物台帳</div>
            <div class="home-subtitle">写真を撮るだけで自動記録<br>AI が品名・特徴を解析します</div>
        </div>
        <div class="home-buttons">
            <button class="btn btn-primary btn-lg" onclick="openCamera()">📷 &nbsp;撮影して登録</button>
            <button class="btn btn-secondary" onclick="showList()">📋 &nbsp;登録一覧を見る</button>
            <button class="btn btn-secondary" onclick="showScreen('setup')" style="font-size:13px; padding:12px;">⚙️ URL設定を変更</button>
        </div>
        <div id="home-police-alert" style="width:100%;max-width:400px;"></div>
        <div class="home-footer">Powered by Gemini AI ✨</div>
    </div>

    <div id="screen-preview" class="screen">
        <img id="preview-img" src="" alt="撮影した画像">
        <div class="preview-actions">
            <button class="btn btn-secondary" onclick="showScreen('home')">✕ やり直す</button>
            <button class="btn btn-primary" onclick="startAnalysis()">🤖 AI解析スタート</button>
        </div>
    </div>

    <div id="screen-analyzing" class="screen">
        <div class="analyzing-wrap">
            <div class="analyzing-ring"></div>
            <div class="analyzing-ring2"></div>
            <div class="analyzing-ring3"></div>
            <div class="analyzing-icon">🤖</div>
        </div>
        <div class="analyzing-title">AI解析中<span class="analyzing-dots"></span></div>
        <div class="analyzing-sub">Gemini AI が画像を読み取っています<br>しばらくお待ちください（10〜30秒）</div>
    </div>

    <div id="screen-form" class="screen">
        <div class="app-header">
            <button class="back-btn" onclick="showScreen('home')">←</button>
            <h1>内容を確認・編集</h1>
        </div>
        <img id="form-photo" src="" alt="登録画像" class="form-photo-preview">
        <div id="form-error" class="error-banner"></div>
        <div class="form-body">
            <div class="ai-badge">✨ AIが自動入力（修正できます）</div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">📅 日付</label>
                    <input type="date" id="f-date" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">⏰ 時間</label>
                    <input type="time" id="f-time" class="form-input">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">📦 拾得物（品名）</label>
                <input type="text" id="f-item" class="form-input" placeholder="例: 財布、スマートフォン">
            </div>
            <div class="form-group">
                <label class="form-label">📍 場所</label>
                <input type="text" id="f-location" class="form-input" placeholder="例: 1Fエントランス">
            </div>
            <div class="form-group">
                <label class="form-label">👤 拾得者</label>
                <input type="text" id="f-person" class="form-input" placeholder="担当者名">
            </div>
            <div class="form-group">
                <label class="form-label">📝 備考</label>
                <textarea id="f-notes" class="form-textarea" placeholder="その他の特記事項"></textarea>
            </div>
            <div class="form-group" style="font-size:13px;line-height:2;">
                <label><input type="checkbox" id="f-valuable"> 貴重品として登録</label><br>
                <label><input type="checkbox" id="f-high-value"> 1万円以上の価値が明らか（要確認）</label><br>
                <small style="color:#94a3b8;">手動指定はこの端末に保存されます。別端末には同期されません。</small>
            </div>
            <button class="btn btn-success btn-lg" onclick="submitForm()" id="submit-btn">✅ &nbsp;スプレッドシートに登録</button>
        </div>
    </div>

    <div id="screen-success" class="screen">
        <div class="success-icon">✅</div>
        <div>
            <div class="success-title">登録完了！</div>
            <div class="success-item-name" id="success-item-name"></div>
            <div class="success-row-info" id="success-row-info"></div>
        </div>
        <div class="success-btn-group">
            <button class="btn btn-primary btn-lg" onclick="openCamera()">📷 &nbsp;続けて登録</button>
            <button class="btn btn-secondary" onclick="showList()">📋 &nbsp;一覧を見る</button>
            <button class="btn btn-secondary" onclick="showScreen('home')">🏠 &nbsp;ホームへ</button>
        </div>
    </div>

    <div id="screen-list" class="screen">
        <div class="app-header">
            <button class="back-btn" onclick="showScreen('home')">←</button>
            <h1>拾得物一覧</h1>
        </div>
        
        <div class="list-filter-bar">
            <button class="list-filter-btn active" id="lf-month" onclick="setListFilter('month')">今月</button>
            <button class="list-filter-btn" id="lf-prev"  onclick="setListFilter('prev')">先月</button>
            <button class="list-filter-btn" id="lf-all"   onclick="setListFilter('all')">全て</button>
            <button class="list-filter-btn" id="lf-valuable" onclick="setStatusFilter('valuable')">貴重品</button>
            <div style="width: 1px; height: 20px; background: rgba(255,255,255,0.1); margin: 0 4px;"></div>
            <button class="list-filter-btn" id="lf-ret"   onclick="setStatusFilter('ret')">返却済み</button>
            <button class="list-filter-btn" id="lf-police" onclick="setStatusFilter('police')">警察届済み</button>
        </div>
        <div id="list-police-alert"></div>

        <div class="list-stats" id="list-stats"></div>
        <div id="list-state-area"></div>
        <div class="list-table-wrap" id="list-table-wrap" style="display:none;">
            <table class="list-table">
                <thead>
                    <tr>
                        <th style="width: 40px; text-align: center;"><input type="checkbox" id="select-all" onclick="toggleSelectAll(this)"></th>
                        <th>写真</th>
                        <th>日付</th>
                        <th>品名</th>
                        <th>場所</th>
                        <th>拾得者</th>
                        <th>状態</th>
                        <th>備考</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="list-tbody"></tbody>
            </table>
        </div>
    </div>

    <div id="return-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:200; align-items:center; justify-content:center; padding:24px;">
        <div style="background:#1e293b; border:1px solid rgba(255,255,255,0.1); border-radius:24px; padding:28px; width:100%; max-width:380px;">
            <div style="font-size:32px; text-align:center; margin-bottom:12px;">⚙️</div>
            <div style="font-size:18px; font-weight:700; color:#f1f5f9; text-align:center; margin-bottom:6px;">処理状況の更新</div>
            <div id="return-item-name" style="font-size:14px; color:#64748b; text-align:center; margin-bottom:20px;"></div>
            <div style="margin-bottom:20px;">
                <label style="display:block; font-size:11px; font-weight:700; color:#64748b; text-transform:uppercase; letter-spacing:1.2px; margin-bottom:8px;">📅 処理日</label>
                <input type="date" id="return-date-input" class="form-input">
            </div>
            <div style="display:flex; flex-direction:column; gap:12px;">
                <div style="display:flex; gap:12px;">
                    <button class="btn btn-secondary" style="flex:1;" onclick="closeProcessModal()">キャンセル</button>
                    <button class="btn btn-success" style="flex:1;" onclick="confirmProcess('ret')">↩️ 返却済みにする</button>
                </div>
                <button class="btn btn-primary" style="width:100%;" onclick="confirmProcess('police')">🚓 警察届済みにする</button>
            </div>
        </div>
    </div>

    <input type="file" id="camera-input" accept="image/*" capture="environment">
    <div class="toast" id="toast"></div>

    <script>
        const GAS_URL_KEY = 'gasApiUrl';
        const SELF_URL = window.location.href.split('?')[0];
        const IS_GAS   = SELF_URL.includes('script.google.com');
        let GAS_URL = IS_GAS ? SELF_URL : (localStorage.getItem(GAS_URL_KEY) || '');

        window.addEventListener('load', function () {
            if (GAS_URL) showScreen('home');
            else showScreen('setup');
        });

        function saveGasUrl() {
            const url = document.getElementById('gas-url-input').value.trim();
            if (!url || !url.startsWith('https://script.google.com')) {
                showToast('⚠️ 正しいGASのURLを入力してください'); return;
            }
            GAS_URL = url; localStorage.setItem(GAS_URL_KEY, url);
            showToast('✅ URLを保存しました'); showScreen('home');
        }

        const state = { base64: null, mime: 'image/jpeg', aiResult: null, driveFileId: null };

        function showScreen(name) {
            document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
            document.getElementById('screen-' + name).classList.add('active');
            window.scrollTo(0, 0);
            if (name === 'home' && GAS_URL) refreshHomeAlerts();
        }

        // 🚀 シンプルに一発起動へ戻しました
        function openCamera() {
            var input = document.getElementById('camera-input');
            input.value = ''; 
            input.click();
        }

        document.getElementById('camera-input').addEventListener('change', function (e) {
            var file = e.target.files[0];
            if (!file) return;
            resizeImage(file, 1280, function (dataUrl) {
                state.base64 = dataUrl.split(',')[1];
                state.mime = 'image/jpeg';
                document.getElementById('preview-img').src = dataUrl;
                document.getElementById('form-photo').src = dataUrl;
                showScreen('preview');
            });
        });

        function resizeImage(file, maxPx, callback) {
            var reader = new FileReader();
            reader.onload = function (e) {
                var img = new Image();
                img.onload = function () {
                    var w = img.width, h = img.height;
                    if (w > maxPx || h > maxPx) {
                        if (w > h) { h = Math.round(h * maxPx / w); w = maxPx; }
                        else { w = Math.round(w * maxPx / h); h = maxPx; }
                    }
                    var canvas = document.createElement('canvas');
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    callback(canvas.toDataURL('image/jpeg', 0.82));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function callGasApi(payload) {
            return fetch(GAS_URL, {
                method: 'POST', body: JSON.stringify(payload), headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            }).then(function (res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.json();
            });
        }

        function startAnalysis() {
            showScreen('analyzing');
            var now  = new Date();
            var date = now.toISOString().split('T')[0];
            var time = now.toTimeString().slice(0, 5);

            callGasApi({ action: 'analyze', imageBase64: state.base64, imageMime: state.mime })
            .then(function (result) {
                if (!result.success) {
                    showToast('❌ エラー: ' + (result.error || '不明なエラー')); showScreen('home'); return;
                }
                state.driveFileId = result.driveFileId;
                state.aiResult    = result.aiResult;
                var ai = result.aiResult || {};
                document.getElementById('f-date').value     = date;
                document.getElementById('f-time').value     = time;
                document.getElementById('f-item').value     = ai.item     || '';
                document.getElementById('f-location').value = ai.location || '';
                document.getElementById('f-person').value   = '';
                document.getElementById('f-notes').value    = ai.notes    || '';
                document.getElementById('f-high-value').checked = ai.highValue === true || highValue({ item: ai.item, notes: ai.notes });
                document.getElementById('f-valuable').checked = ai.highValue === true || isValuable({ item: ai.item, notes: ai.notes });
                document.getElementById('form-error').classList.remove('show');
                showScreen('form');
            }).catch(function (err) {
                showToast('❌ 通信エラー: ' + err.message); showScreen('home');
            });
        }

        function submitForm() {
            var btn = document.getElementById('submit-btn');
            btn.disabled = true; btn.textContent = '📤 送信中...';
            var errorEl = document.getElementById('form-error');
            errorEl.classList.remove('show');

            callGasApi({
                action: 'submit', driveFileId: state.driveFileId, imageBase64: state.driveFileId ? null : state.base64, imageMime: state.mime,
                date: document.getElementById('f-date').value, time: document.getElementById('f-time').value, location: document.getElementById('f-location').value, person: document.getElementById('f-person').value, item: document.getElementById('f-item').value, notes: document.getElementById('f-notes').value
            }).then(function (result) {
                btn.disabled = false; btn.innerHTML = '✅ &nbsp;スプレッドシートに登録';
                if (!result.success) {
                    errorEl.textContent = '❌ ' + (result.error || 'エラーが発生しました'); errorEl.classList.add('show'); return;
                }
                document.getElementById('success-item-name').textContent = result.item || '（品名なし）';
                document.getElementById('success-row-info').textContent = '行 ' + result.row + ' に登録されました';
                var enteredDate = document.getElementById('f-date').value.split('-');
                var savedItem = { sheetName: (new Date().getMonth()+1) + '月', row: result.row,
                    date: Number(enteredDate[1]) + '月' + Number(enteredDate[2]) + '日',
                    time: document.getElementById('f-time').value, item: result.item || document.getElementById('f-item').value,
                    person: document.getElementById('f-person').value, location: document.getElementById('f-location').value };
                saveManualEntry(savedItem, { valuable: document.getElementById('f-valuable').checked, highValue: document.getElementById('f-high-value').checked });
                showScreen('success');
            }).catch(function (err) {
                btn.disabled = false; btn.innerHTML = '✅ &nbsp;スプレッドシートに登録';
                errorEl.textContent = '❌ 通信エラー: ' + err.message; errorEl.classList.add('show');
            });
        }

        var allListItems = [];
        var activePeriod = 'month';
        var statusFilter = 'all';
        const MANUAL_KEY = 'hirotokubutsu-manual-classification-v1';
        function manualKey(it) {
            return JSON.stringify([it.sheetName, Number(it.row), it.date || '', it.time || '', it.item || '', it.person || '', it.location || '']);
        }
        function manualEntry(it) {
            try { return JSON.parse(localStorage.getItem(MANUAL_KEY) || '{}')[manualKey(it)] || {}; }
            catch (_) { return {}; }
        }
        function saveManualEntry(it, change) {
            try {
                var entries = JSON.parse(localStorage.getItem(MANUAL_KEY) || '{}');
                entries[manualKey(it)] = Object.assign({}, entries[manualKey(it)] || {}, change);
                localStorage.setItem(MANUAL_KEY, JSON.stringify(entries));
            } catch (_) { showToast('⚠️ この端末に指定を保存できませんでした'); }
        }

        function cashAmount(it) {
            var name = String(it.item || '');
            if (!/(現金|硬貨|紙幣|お金|お札|\d+円札|[一二三五千万円]+円札)/.test(name)) return 0;
            var text = (name + ' ' + (it.notes || '')).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
            var normalized = text.replace(/(\d+)\s*万\s*(?:(\d+)\s*千\s*)?円/g, (_, man, sen) => (Number(man)*10000 + Number(sen || 0)*1000) + '円')
                .replace(/(\d+)\s*千\s*円/g, (_, sen) => Number(sen)*1000 + '円');
            var statedTotal = normalized.match(/(?:合計|総額|計)\s*([\d,，]+)\s*円/);
            var parts = normalized.replace(/(?:合計|総額|計)\s*[\d,，]+\s*円/g, '');
            var denominations = Array.from(parts.matchAll(/([\d,，]+|一万|壱万|五千|千)\s*円(?:札|玉)?\s*(?:(\d+)\s*枚)?/g), m => {
                var amount = ({ '一万': 10000, '壱万': 10000, '五千': 5000, '千': 1000 })[m[1]] || Number(m[1].replace(/[,，]/g, ''));
                return amount * Number(m[2] || 1);
            });
            return Math.max(statedTotal ? Number(statedTotal[1].replace(/[,，]/g, '')) : 0,
                denominations.reduce((sum, amount) => sum + amount, 0));
        }
        function highValue(it) {
            var manual = manualEntry(it);
            if (typeof manual.highValue === 'boolean') return manual.highValue;
            if (it.highValue === true || it.highValue === 'TRUE') return true;
            var text = String(it.item || '') + ' ' + String(it.notes || '');
            if (/(ロレックス|高級腕時計|ダイヤモンド|プラチナ|金製|MacBook|ノートパソコン|一眼レフ)/i.test(text)) return true;
            if (/(?:[1-9]\d*|[一二三四五六七八九])\s*万\s*(?:(?:\d+|[一二三四五六七八九])\s*千\s*)?(?:[\d,，]+\s*)?円/.test(text)) return true;
            if (Array.from(text.matchAll(/([\d,，]+)\s*円/g)).some(m => Number(m[1].replace(/[,，]/g, '')) >= 10000)) return true;
            if (/(?:価値|相場|価格|定価|時価|査定).{0,12}(?:1[\d,，]*|[2-9][\d,，]*)万円|(?:1[\d,，]*|[2-9][\d,，]*)万円.{0,12}(?:相当|以上|価値)/.test(text)) return true;
            return Array.from(text.matchAll(/(?:価値|相場|価格|定価|時価|査定).{0,12}([\d,，]+)\s*円/g)).some(m => Number(m[1].replace(/[,，]/g, '')) >= 10000);
        }
        function isValuable(it) {
            var manual = manualEntry(it);
            if (typeof manual.valuable === 'boolean') return manual.valuable;
            if (it.valuable === 'yes') return true;
            if (it.valuable === 'no') return false;
            var name = String(it.item || '');
            return cashAmount(it) >= 1000 || /(スマホ|スマートフォン|携帯電話|iPhone|財布|運転免許証|免許証|マイナンバーカード|クレジットカード|キャッシュカード)/i.test(name) || highValue(it);
        }
        function needsPolicePriority(it) {
            var status = String(it.status || '');
            return !/返却|警察/.test(status) && (cashAmount(it) >= 5000 || /(運転免許証|免許証)/.test(String(it.item || '')) || highValue(it));
        }
        function foundDate(it) {
            if (/^\d{4}-\d{2}-\d{2}$/.test(it.isoDate || '')) return new Date(it.isoDate + 'T12:00:00');
            var match = String(it.date || '').match(/(\d{1,2})月(\d{1,2})日/);
            if (!match) return null;
            var now = new Date(), date = new Date(now.getFullYear(), Number(match[1])-1, Number(match[2]), 12);
            if (date > new Date(now.getFullYear(), now.getMonth(), now.getDate()+1)) date.setFullYear(date.getFullYear()-1);
            return date;
        }
        function policeAlerts(items) {
            var today = new Date(); today.setHours(12,0,0,0);
            return items.filter(needsPolicePriority).map(function(it) {
                var date = foundDate(it);
                if (!date || isNaN(date)) return null;
                var days = Math.round((date.getTime() + 7*86400000 - today.getTime()) / 86400000);
                return Object.assign({}, it, { daysLeft: days });
            }).filter(Boolean).sort((a,b) => a.daysLeft-b.daysLeft);
        }
        function alertHtml(items) {
            if (!items.length) return '';
            var urgent = items.filter(it => it.daysLeft <= 2);
            var details = items.slice(0, 4).map(it => escHtml(it.item || '品名なし') + '（' + (it.daysLeft < 0 ? '期限超過' : it.daysLeft === 0 ? '今日が目安' : 'あと' + it.daysLeft + '日') + '）').join('、');
            return '<div class="police-alert" role="status"><strong>🚓 警察届の優先確認 ' + items.length + '件' + (urgent.length ? '・期限間近/超過 ' + urgent.length + '件' : '') + '</strong>' + details + (items.length > 4 ? ' ほか' : '') + '<br><small>拾得日から7日を目安に確認。年のない過去記録は推定です。これは指定条件の優先通知で、その他の落とし物の届出要否を免除しません。</small></div>';
        }
        function refreshHomeAlerts() {
            document.getElementById('home-police-alert').textContent = '警察届の優先対象を確認中…';
            callGasApi({ action: 'list', period: 'all' }).then(result => {
                if (!result.success) throw new Error(result.error || '取得失敗');
                document.getElementById('home-police-alert').innerHTML = alertHtml(policeAlerts(result.items || []));
            }).catch(() => { document.getElementById('home-police-alert').textContent = '⚠️ 警察届の優先対象を取得できません。台帳を直接確認してください。'; });
        }

        function showList(period) {
            activePeriod = period || activePeriod;
            showScreen('list');
            document.getElementById('list-state-area').innerHTML = '<div class="list-state"><div class="list-spinner"></div>読み込み中...</div>';
            document.getElementById('list-table-wrap').style.display = 'none';
            document.getElementById('list-stats').innerHTML = '';
            document.getElementById('list-police-alert').textContent = '';

            ['month','prev','all'].forEach(p => {
                document.getElementById('lf-' + p).classList.toggle('active', p === activePeriod);
            });

            callGasApi({ action: 'list', period: 'all' }).then(function (result) {
                if (!result.success || !result.items) {
                    document.getElementById('list-state-area').innerHTML = '<div class="list-state">❌ データ取得に失敗しました</div>'; return;
                }
                allListItems = result.items || [];
                renderList();
            }).catch(function (err) {
                document.getElementById('list-state-area').innerHTML = '<div class="list-state">❌ ' + escHtml(err.message) + '</div>';
            });
        }

        function setListFilter(p) {
            statusFilter = 'all'; 
            updateStatusBtnUI();
            showList(p);
        }

        function setStatusFilter(s) {
            statusFilter = (statusFilter === s) ? 'all' : s;
            updateStatusBtnUI();
            if (statusFilter !== 'all') activePeriod = 'all';
            showList(activePeriod);
        }
        
        function updateStatusBtnUI() {
            ['valuable', 'ret', 'police'].forEach(s => {
                document.getElementById('lf-' + s).classList.toggle('active', s === statusFilter);
            });
        }

        function extractCashAmount(itemStr, notesStr) {
            var combined = (itemStr + " " + notesStr).toLowerCase();
            if (combined.includes("ic") || combined.includes("suica") || combined.includes("pasmo") || 
                combined.includes("nanaco") || combined.includes("waon") || combined.includes("edy")) {
                return 0;
            }
            var regex = /([0-9０-９,，]+)\s*円/g;
            var match; var total = 0;
            while ((match = regex.exec(combined)) !== null) {
                var numStr = match[1].replace(/[０-９]/g, function(s) { return String.fromCharCode(s.charCodeAt(0) - 0xFEE0); }).replace(/[,，]/g, ''); 
                var val = parseInt(numStr, 10);
                if (!isNaN(val)) total += val;
            }
            return total;
        }

        function toggleBulkDeleteBtn() {
            var checkboxes = document.querySelectorAll('.delete-checkbox:checked');
            var btn = document.getElementById('bulk-delete-btn');
            var selectAllCb = document.getElementById('select-all');
            if (selectAllCb) selectAllCb.checked = (checkboxes.length > 0 && checkboxes.length === document.querySelectorAll('.delete-checkbox').length);
            
            if (checkboxes.length > 0) {
                btn.style.display = 'inline-block';
                btn.innerHTML = '🗑 選択した ' + checkboxes.length + ' 件を削除';
            } else {
                btn.style.display = 'none';
            }
        }

        function toggleSelectAll(mainCb) {
            document.querySelectorAll('.delete-checkbox').forEach(cb => cb.checked = mainCb.checked);
            toggleBulkDeleteBtn();
        }

        function confirmBulkDelete() {
            var checkboxes = document.querySelectorAll('.delete-checkbox:checked');
            if (checkboxes.length === 0) return;
            if (!confirm('選択した ' + checkboxes.length + ' 件のデータを一括削除します。\n本当によろしいですか？')) return;
            var targets = [];
            checkboxes.forEach(function(cb) { targets.push({ sheetName: cb.getAttribute('data-sheet'), row: cb.getAttribute('data-row') }); });
            var btn = document.getElementById('bulk-delete-btn');
            btn.disabled = true; btn.innerHTML = '削除中...';
            callGasApi({ action: 'bulkDelete', targets: targets }).then(function(res) {
                if (res.success) { showToast('✅ 一括削除が完了しました'); showList(); } 
                else { showToast('❌ エラー: ' + res.error); }
            }).catch(function(err) { showToast('❌ 通信エラー: ' + err.message); })
            .finally(function() { btn.disabled = false; btn.style.display = 'none'; });
        }

        function renderList() {
            var items = allListItems.filter(function(it) {
                if (activePeriod === 'month' && it.sheetName !== (new Date().getMonth()+1) + '月') return false;
                if (activePeriod === 'prev') {
                    var prev = new Date(); prev.setMonth(prev.getMonth()-1);
                    if (it.sheetName !== (prev.getMonth()+1) + '月') return false;
                }
                if (statusFilter === 'valuable') return isValuable(it);
                if (statusFilter === 'ret') return it.status && it.status.includes('返却');
                if (statusFilter === 'police') return it.status && it.status.includes('警察');
                return true;
            });
            document.getElementById('list-police-alert').innerHTML = alertHtml(policeAlerts(allListItems));

            var totalCash = 0;
            items.forEach(function(it) { totalCash += extractCashAmount(it.item || '', it.notes || ''); });

            var total    = items.length;
            var keeping  = items.filter(function(it) { return !it.status || (!it.status.includes('返却') && !it.status.includes('警察')); }).length;
            var returned = items.filter(function(it) { return it.status && it.status.includes('返却'); }).length;
            var policed  = items.filter(function(it) { return it.status && it.status.includes('警察'); }).length;

            document.getElementById('list-stats').innerHTML = 
                '<div style="width:100%; margin-bottom:10px; display:flex; gap:12px; flex-wrap:wrap;">' +
                '<span><span class="stat-dot" style="background:#64748b"></span>表示 ' + total + '件</span>' +
                '<span><span class="stat-dot" style="background:#fbbf24"></span>保管中 ' + keeping + '件</span>' +
                '<span><span class="stat-dot" style="background:#a78bfa"></span>返却済 ' + returned + '件</span>' +
                '<span><span class="stat-dot" style="background:#60a5fa"></span>警察済 ' + policed + '件</span>' +
                '</div>' +
                '<div style="width:100%; padding: 10px; background: rgba(10, 15, 30, 0.95); border: 1px solid rgba(255,255,255,0.1); display:flex; justify-content:space-between; align-items:center; border-radius: 8px; margin-bottom: 10px;">' +
                '<span style="color:#34d399; font-weight:bold; font-size:13px;">💰 現金合計：' + totalCash.toLocaleString() + ' 円</span>' +
                '<button id="bulk-delete-btn" class="ret-btn" style="background:#ef4444; color:white; border:none; display:none; margin:0;" onclick="confirmBulkDelete()"></button>' +
                '</div>' +
                (activePeriod === 'all' && (statusFilter === 'all' || statusFilter === 'ret') ? '<button class="bulk-old-btn" onclick="confirmOldDelete()">🗑 先々月以前の' + (statusFilter === 'ret' ? '返却済み' : '全件') + 'を確認して一括削除</button>' : '');

            if (items.length === 0) {
                document.getElementById('list-table-wrap').style.display = 'none';
                document.getElementById('list-state-area').innerHTML = '<div class="list-state">該当なし</div>';
                return;
            }

            document.getElementById('list-state-area').innerHTML = '';
            document.getElementById('list-table-wrap').style.display = 'block';
            document.getElementById('list-tbody').innerHTML = items.map(function(it) {
                
                var isRet = it.status && it.status.includes('返却');
                var isPol = it.status && it.status.includes('警察');
                var isProcessed = isRet || isPol;
                
                var statusClass = isRet ? 'status-returned' : isPol ? 'status-police' : (it.status && it.status.includes('完了')) ? 'status-done' : (it.status && it.status.includes('エラー')) ? 'status-error' : 'status-pending';
                var thumb = it.image ? '<img src="' + escHtml(it.image) + '" alt="" loading="lazy">' : '<div class="no-img">📷</div>';
                
                var actionBtn = '';
                if (isProcessed) {
                    actionBtn = '<button class="ret-btn action-btn-undo" onclick="undoStatus(' + it.row + ',\'' + escHtml(it.sheetName) + '\')">↩️ 戻す</button>';
                } else {
                    actionBtn = '<button class="ret-btn action-btn-process" onclick="openProcessModal(' + it.row + ',\'' + escHtml(it.sheetName) + '\',\'' + escHtml(it.item || '') + '\')">⚙️ 処理</button>';
                }
                
                return '<tr class="' + (isProcessed ? 'tr-returned' : '') + '">' +
                    '<td style="text-align:center;"><input type="checkbox" class="delete-checkbox" data-sheet="' + escHtml(it.sheetName) + '" data-row="' + it.row + '" onchange="toggleBulkDeleteBtn()"></td>' +
                    '<td class="td-thumb">' + thumb + '</td>' +
                    '<td style="white-space:nowrap">' + escHtml((it.date || '') + ' ' + (it.time || '')) + '</td>' +
                    '<td class="td-item">' + escHtml(it.item || '---') + (isValuable(it) ? ' <span class="valuable-badge">💎 貴重品</span>' : '') + (needsPolicePriority(it) ? ' <span class="valuable-badge" style="color:#fca5a5">🚓 要確認</span>' : '') + '</td>' +
                    '<td>' + escHtml(it.location || '---') + '</td>' +
                    '<td>' + escHtml(it.person || '---') + '</td>' +
                    '<td><span class="status-badge ' + statusClass + '">' + escHtml(it.status || '---') + '</span></td>' +
                    '<td class="td-notes">' + escHtml(it.notes || '---') + '</td>' +
                    '<td>' + actionBtn + '<br><button class="ret-btn valuable-toggle" onclick="toggleValuable(' + it.row + ',\'' + escHtml(it.sheetName) + '\',' + (!isValuable(it)) + ')">' + (isValuable(it) ? '💎 解除' : '💎 貴重品へ') + '</button>' +
                    '<br><button class="ret-btn valuable-toggle" onclick="toggleHighValue(' + it.row + ',\'' + escHtml(it.sheetName) + '\',' + (!highValue(it)) + ')">' + (highValue(it) ? '🚓 高額解除' : '🚓 高額品指定') + '</button></td>' +
                    '</tr>';
            }).join('');
        }

        function toggleValuable(row, sheetName, value) {
            var it = allListItems.find(x => x.row === row && x.sheetName === sheetName);
            if (!it) return;
            saveManualEntry(it, { valuable: value });
            renderList(); showToast('✅ この端末の貴重品指定を更新しました');
        }
        function toggleHighValue(row, sheetName, value) {
            var it = allListItems.find(x => x.row === row && x.sheetName === sheetName);
            if (!it) return;
            saveManualEntry(it, { highValue: value });
            renderList(); showToast('✅ この端末の高額品指定を更新しました');
        }
        function oldCandidates(items, mode) {
            var thisMonth = new Date().getMonth()+1;
            return items.filter(function(it) {
                var match = String(it.sheetName || '').match(/^(\d{1,2})月$/);
                if (!match) return false;
                var age = (thisMonth-Number(match[1])+12)%12;
                return age >= 2 && (mode !== 'ret' || String(it.status || '').includes('返却'));
            });
        }
        function confirmOldDelete() {
            var mode = statusFilter === 'ret' ? 'ret' : 'all';
            callGasApi({ action: 'list', period: 'all' }).then(function(result) {
                if (!result.success) throw new Error(result.error || '取得失敗');
                var targets = oldCandidates(result.items || [], mode);
                if (!targets.length) { showToast('画面で取得できる対象はありません'); return; }
                var months = [...new Set(targets.map(it => it.sheetName))];
                var message = '先々月以前の' + (mode === 'ret' ? '返却済み' : '全件') + ' ' + targets.length + '件を台帳から削除します。\n対象月: ' + months.join('、') + '\n台帳には年がないため、今月・先月と同じ月名の過去年分は判別できず対象外です。GASの一覧取得上限は各月直近100件で、それ以前の行も残る可能性があります。写真はDriveに残り、台帳の削除は元に戻せません。続けますか？';
                if (!confirm(message)) return;
                var typed = prompt('誤操作防止のため「' + targets.length + '件削除」と入力してください。');
                if (typed !== targets.length + '件削除') return;
                // 行番号が変わっていないか再取得で照合してから既存の一括削除APIを使う。
                callGasApi({ action: 'list', period: 'all' }).then(function(latest) {
                    if (!latest.success) throw new Error(latest.error || '再確認失敗');
                    var current = oldCandidates(latest.items || [], mode);
                    var signature = arr => arr.map(it => manualKey(it) + '|' + it.status).sort().join('\n');
                    if (signature(current) !== signature(targets)) throw new Error('対象が変わりました。更新してやり直してください');
                    return callGasApi({ action: 'bulkDelete', targets: current.map(it => ({ sheetName: it.sheetName, row: it.row })) });
                }).then(function(res) {
                    if (!res.success) throw new Error(res.error || '削除失敗');
                    showToast('✅ ' + targets.length + '件を削除しました'); showList('all');
                }).catch(function(err) { showToast('❌ ' + err.message); });
            }).catch(function(err) { showToast('❌ ' + err.message); });
        }

        var _processRow = null, _processSheet = null;
        
        function openProcessModal(row, sheetName, itemName) {
            _processRow   = row; 
            _processSheet = sheetName;
            document.getElementById('return-item-name').textContent = itemName || '（品名なし）';
            document.getElementById('return-date-input').value = new Date().toISOString().split('T')[0];
            document.getElementById('return-modal').style.display = 'flex';
        }
        
        function closeProcessModal() { 
            document.getElementById('return-modal').style.display = 'none'; 
        }
        
        function confirmProcess(type) {
            var returnDate = document.getElementById('return-date-input').value;
            var newStatus = type === 'ret' ? '返却済み ✅' : '警察届済み 🚓';
            
            closeProcessModal();
            callGasApi({ action: 'updateStatus', row: _processRow, sheetName: _processSheet, status: newStatus, returnDate: returnDate })
            .then(function(result) {
                if (result.success) { showToast('✅ 状態を更新しました'); showList(); } 
                else { showToast('❌ エラー: ' + (result.error || '更新失敗')); }
            }).catch(function(err) { showToast('❌ 通信エラー: ' + err.message); });
        }

        function undoStatus(row, sheetName) {
            if (!confirm('この拾得物を「未処理（保管中）」の状態に戻しますか？\n（※備考欄に追記された処理日はそのまま履歴として残ります）')) return;
            
            callGasApi({ action: 'updateStatus', row: row, sheetName: sheetName, status: '完了 ✅' })
            .then(function(result) {
                if (result.success) { showToast('✅ 未処理に戻しました'); showList(); } 
                else { showToast('❌ エラー: ' + (result.error || '更新失敗')); }
            }).catch(function(err) { showToast('❌ 通信エラー: ' + err.message); });
        }

        function escHtml(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
        function showToast(msg) { var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(function () { t.classList.remove('show'); }, 3000); }
    </script>
</body>
</html>
